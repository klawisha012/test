name: Distribute tickets

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled, unassigned]
  push:
    paths:
      - .agents/team.json

permissions:
  contents: read
  issues: write

concurrency:
  group: ticket-distribution
  cancel-in-progress: false

jobs:
  distribute:
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'ready-for-agent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Give unassigned tickets an owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .agents/team.json ]; then
            python3 .agents/workflow/distribute.py --team .agents/team.json --apply
          else
            echo 'No roster configured; no issues changed.'
          fi
